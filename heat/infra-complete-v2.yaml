heat_template_version: 2018-08-31

description: >
  Infrastructure avec Load Balancer Octavia et deux serveurs Web Caddy. TD5 Exercice 2.

parameters:
  image:
    type: string
    default: ubuntu  # Doit être une image Ubuntu/Debian pour supporter apt-get
  flavor:
    type: string
    default: m1.small # m1.nano est trop petit pour faire tourner Ubuntu
  external_network:
    type: string
    default: public

resources:
  mon_reseau:
    type: OS::Neutron::Net
    properties:
      name: reseau-heat

  mon_sous_reseau:
    type: OS::Neutron::Subnet
    properties:
      name: subnet-heat
      network: { get_resource: mon_reseau }
      cidr: 10.0.2.0/24
      dns_nameservers: [ "8.8.8.8", "10.0.0.1" ]

  mon_routeur:
    type: OS::Neutron::Router
    properties:
      name: routeur-heat
      external_gateway_info:
        network: { get_param: external_network }

  interface_routeur:
    type: OS::Neutron::RouterInterface
    properties:
      router: { get_resource: mon_routeur }
      subnet: { get_resource: mon_sous_reseau }

  # Groupe de sécurité autorisant SSH (22) et HTTP (80)
  sg_web:
    type: OS::Neutron::SecurityGroup
    properties:
      name: sg_web
      description: Autoriser SSH et HTTP
      rules:
        - protocol: tcp
          port_range_min: 22
          port_range_max: 22
          remote_ip_prefix: 0.0.0.0/0
        - protocol: tcp
          port_range_min: 80
          port_range_max: 80
          remote_ip_prefix: 0.0.0.0/0

  vm1:
    type: OS::Nova::Server
    properties:
      name: VM1
      image: { get_param: image }
      flavor: { get_param: flavor }
      networks:
        - network: { get_resource: mon_reseau }
      security_groups:
        - { get_resource: sg_web }
      user_data_format: RAW
      user_data: |
        #!/bin/bash
        echo "ubuntu:password" | chpasswd
        sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
        systemctl restart ssh
        echo "nameserver 10.0.0.1" > /etc/resolv.conf
        echo "nameserver 8.8.8.8" >> /etc/resolv.conf
        hostname=$(hostname)
        echo "127.0.1.1 $hostname" >> /etc/hosts
        apt-get update
        apt-get install -y curl debian-keyring debian-archive-keyring apt-transport-https
        curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
        curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | tee /etc/apt/sources.list.d/caddy-stable.list
        apt-get update
        apt-get install -y caddy
        mkdir -p /var/www/html
        ip_addr=$(ip -4 -o addr show dev ens3 | awk '{print $4}' | cut -d/ -f1)
        # Modification ici pour correspondre à l'énoncé
        echo "Serveur: VM1 <br> Adresse IP privee: $ip_addr" > /var/www/html/index.html
        cat > /etc/caddy/Caddyfile <<'EOF_CADDY'
        :80 {
            root * /var/www/html
            file_server
        }
        EOF_CADDY
        systemctl enable caddy
        systemctl restart caddy

  vm2:
    type: OS::Nova::Server
    properties:
      name: VM2
      image: { get_param: image }
      flavor: { get_param: flavor }
      networks:
        - network: { get_resource: mon_reseau }
      security_groups:
        - { get_resource: sg_web }
      user_data_format: RAW
      user_data: |
        #!/bin/bash
        echo "ubuntu:password" | chpasswd
        sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
        systemctl restart ssh
        echo "nameserver 10.0.0.1" > /etc/resolv.conf
        echo "nameserver 8.8.8.8" >> /etc/resolv.conf
        hostname=$(hostname)
        echo "127.0.1.1 $hostname" >> /etc/hosts
        apt-get update
        apt-get install -y curl debian-keyring debian-archive-keyring apt-transport-https
        curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
        curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | tee /etc/apt/sources.list.d/caddy-stable.list
        apt-get update
        apt-get install -y caddy
        mkdir -p /var/www/html
        ip_addr=$(ip -4 -o addr show dev ens3 | awk '{print $4}' | cut -d/ -f1)
        # Modification ici pour correspondre à l'énoncé
        echo "Serveur: VM2 <br> Adresse IP privee: $ip_addr" > /var/www/html/index.html
        cat > /etc/caddy/Caddyfile <<'EOF_CADDY'
        :80 {
            root * /var/www/html
            file_server
        }
        EOF_CADDY
        systemctl enable caddy
        systemctl restart caddy

  # --- CONFIGURATION DU LOAD BALANCER OCTAVIA ---
  mon_lb:
    type: OS::Octavia::LoadBalancer
    properties:
      vip_subnet: { get_resource: mon_sous_reseau }

  mon_listener:
    type: OS::Octavia::Listener
    properties:
      loadbalancer: { get_resource: mon_lb }
      protocol: HTTP
      protocol_port: 80

  mon_pool:
    type: OS::Octavia::Pool
    properties:
      listener: { get_resource: mon_listener }
      protocol: HTTP
      lb_algorithm: ROUND_ROBIN

  membre_vm1:
    type: OS::Octavia::PoolMember
    properties:
      pool: { get_resource: mon_pool }
      address: { get_attr: [vm1, first_address] }
      protocol_port: 80
      subnet: { get_resource: mon_sous_reseau }

  membre_vm2:
    type: OS::Octavia::PoolMember
    properties:
      pool: { get_resource: mon_pool }
      address: { get_attr: [vm2, first_address] }
      protocol_port: 80
      subnet: { get_resource: mon_sous_reseau }

  lb_floating_ip:
    type: OS::Neutron::FloatingIP
    properties:
      floating_network: { get_param: external_network }
      port_id: { get_attr: [mon_lb, vip_port_id] }

outputs:
  loadbalancer_ip:
    description: Adresse IP publique du Load Balancer
    value: { get_attr: [lb_floating_ip, floating_ip_address] }
